name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (arm64) was repeatedly not picked up for lack of
        # capacity on 2026-10-19; the Intel image is a standard runner.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install Linux capture and encoder build dependencies
        if: runner.os == 'Linux'
        # capture-linux links libpipewire-0.3 (>= 0.3.44); encoder-ffmpeg links
        # libavcodec/libavformat/libswscale (H.264 via libx264, AAC);
        # bindgen needs libclang.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          pkg-config --modversion libpipewire-0.3 libavcodec libavformat libswscale
      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        # capture-macos builds the Swift bridge of `screencapturekit`, whose
        # Metal bindings need the macOS 26 SDK (Xcode 26 or newer).
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        # encoder-ffmpeg links the FFmpeg libraries found through pkg-config.
        run: |
          brew install ffmpeg pkgconf
          pkg-config --modversion libavcodec libavformat libswscale
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        # A prebuilt shared FFmpeg (with libx264) from BtbN/FFmpeg-Builds,
        # checked against the release's own checksum file. ffmpeg-sys-next
        # reads it through FFMPEG_DIR; tests load the DLLs from PATH; bindgen
        # uses the runner's LLVM.
        env:
          FFMPEG_BUILD: ffmpeg-n8.1-latest-win64-gpl-shared-8.1
        run: |
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" "$base/$FFMPEG_BUILD.zip"
          curl -fsSL -o "$RUNNER_TEMP/checksums.sha256" "$base/checksums.sha256"
          expected=$(grep " $FFMPEG_BUILD.zip\$" "$RUNNER_TEMP/checksums.sha256" | cut -d' ' -f1)
          actual=$(sha256sum < "$RUNNER_TEMP/ffmpeg.zip" | cut -d' ' -f1)
          echo "sha256 expected $expected, got $actual"
          test -n "$expected" && test "$expected" = "$actual"
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/ffmpeg.zip" > /dev/null
          dir="$(cygpath -w "$RUNNER_TEMP/$FFMPEG_BUILD")"
          echo "FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir\bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
          ls "$RUNNER_TEMP/$FFMPEG_BUILD/lib" | head
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        # All failures in one run, not just the first failing test binary.
        run: cargo test --workspace --locked --no-fail-fast
      - name: "M0 acceptance: CLI status"
        run: cargo run --locked -q -p streamforge-cli -- status --json
      - name: Capture capabilities of this runner
        # For the record (docs/platforms.md); runners have no desktop or
        # microphone, so most entries say why they are unavailable.
        run: cargo run --locked -q -p streamforge-cli -- capture caps
      - name: Screen sources of this runner
        # For the record: Windows lists its monitor; macOS needs a
        # screen-recording permission (`permission_denied` without it);
        # Linux has only the portal picker. Failing here is expected.
        run: cargo run --locked -q -p streamforge-cli -- capture sources || true
      - name: "M1 smoke: headless engine over a shell pipe"
        run: |
          printf '%s\n' '{"id":1,"command":"get_status"}' \
            | cargo run --locked -q -p streamforge-engine \
            | tee engine-response.json
          grep -F '"id":1,"ok":true' engine-response.json
