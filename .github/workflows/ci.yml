name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  tested:
    # A push to main whose tree a pull request's CI already tested green
    # (the squash merge of an up-to-date pull request) skips rustfmt and
    # the tests: they would test the same code again. Direct pushes,
    # pull requests and manual runs test as usual, and so does any push
    # where this check cannot decide. Bench still runs on main.
    name: already tested
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.tree.outputs.skip }}
    steps:
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          tested() {
            [ "$EVENT" = push ] || return 1
            tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha) || return 1
            heads=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '.[] | select(.merged_at != null) | .head.sha') || return 1
            for head in $heads; do
              head_tree=$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha) || continue
              [ "$head_tree" = "$tree" ] || continue
              green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" \
                --jq .total_count) || continue
              if [ "$green" -gt 0 ]; then
                echo "Tree $tree was tested green as pull request head $head."
                return 0
              fi
            done
            return 1
          }
          if tested; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Already tested on its pull request; rustfmt and tests skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: rustfmt
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check

  check:
    name: clippy + test (${{ matrix.os }})
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (arm64) was repeatedly not picked up for lack of
        # capacity on 2026-10-19; the Intel image is a standard runner.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-setup
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Capture capabilities of this runner
        # For the record (docs/platforms.md); runners have no desktop or
        # microphone, so most entries say why they are unavailable.
        run: cargo run --locked -q -p streamforge-cli -- capture caps
      - name: Video encoder of this runner
        # For the record: which H.264 encoder `auto` picks here, and why
        # the hardware candidates were skipped (runners have no GPU).
        run: |
          cargo run --locked -q -p streamforge-cli -- record --file-name ci-encoder.mkv \
            --output-dir "$RUNNER_TEMP" --duration-ms 1000 > "$RUNNER_TEMP/encoder.json"
          py=$(command -v python3 || command -v python)
          "$py" -c "import json,sys; t=open(sys.argv[1]).read(); v=json.loads(t[t.index('{'):])['recording']['video']; print(json.dumps({k: v[k] for k in ('encoder', 'hardware', 'skipped')}, indent=2))" "$RUNNER_TEMP/encoder.json"
      - name: Capture targets of this runner
        # For the record: Windows lists its monitor; macOS needs a
        # screen-recording permission (`permission_denied` without it);
        # Linux has only the portal picker. Failing here is expected.
        run: cargo run --locked -q -p streamforge-cli -- capture targets || true
      - name: Test
        # All failures in one run, not just the first failing test binary.
        run: cargo test --workspace --locked --no-fail-fast
      - name: "M0 acceptance: CLI status"
        run: cargo run --locked -q -p streamforge-cli -- status --json
      - name: "M1 smoke: headless engine over a shell pipe"
        run: |
          printf '%s\n' '{"id":1,"command":"get_status"}' \
            | cargo run --locked -q -p streamforge-engine \
            | tee engine-response.json
          grep -F '"id":1,"ok":true' engine-response.json

  bench:
    # Informational (architecture assessment, step 7): prints render, mix,
    # loss and CPU figures for this runner, on pushes to main and manual
    # runs (not on every pull request: three more runners for numbers
    # nobody gates on). No thresholds: shared runners vary. A failing
    # measurement only leaves a warning; setup and build failures still
    # fail the job. Compare numbers on one machine (docs/testing.md).
    # A one-minute soak run keeps the soak harness working against the
    # engine; the real soak test is an hour on a real machine.
    name: bench (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-setup
      - name: Build (release)
        run: cargo build --release --locked -p streamforge-bench -p streamforge-engine -p streamforge-soak
      - name: Measure
        continue-on-error: true
        run: |
          target/release/streamforge-bench --seconds 5 --runs 2 || {
            echo "::warning::streamforge-bench failed on ${{ matrix.os }} (informational)"
            exit 1
          }
      - name: Soak (one minute)
        continue-on-error: true
        run: |
          target/release/streamforge-soak --seconds 60 --output-dir "$RUNNER_TEMP" || {
            echo "::warning::streamforge-soak failed on ${{ matrix.os }} (informational)"
            exit 1
          }
