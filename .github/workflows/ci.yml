name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (arm64) jobs were repeatedly not picked up due to runner
        # capacity (2026-10-19); the Intel image is a standard runner as well.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install Linux capture and encoder build dependencies
        if: runner.os == 'Linux'
        # capture-linux links libpipewire-0.3 (>= 0.3.44); encoder-ffmpeg links
        # libavcodec/libavformat/libswscale (H.264 via libx264, AAC);
        # bindgen needs libclang.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          pkg-config --modversion libpipewire-0.3 libavcodec libavformat libswscale
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: "M0 acceptance: CLI status"
        run: cargo run --locked -q -p streamforge-cli -- status --json
      - name: "M1 smoke: headless engine over a shell pipe"
        run: |
          printf '%s\n' '{"id":1,"command":"get_status"}' \
            | cargo run --locked -q -p streamforge-engine \
            | tee engine-response.json
          grep -F '"id":1,"ok":true' engine-response.json
