name: Release

# Linux packages, one per distribution family: FFmpeg and PipeWire are
# linked dynamically, and their library versions differ between
# distributions (packaging/linux/package.sh). The Windows package brings
# its own FFmpeg, built from pinned sources (ADR 0020), whose source
# archives are attached to the release. Each package is built and
# smoke-tested on its own system.
#
# A pushed `v*` tag creates a *draft* release with the packages; a person
# publishes it after checking. Manual runs and pull requests that change
# the packaging are dry runs: they build and upload the packages as
# workflow artifacts and publish nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    name: linux (ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release notes
        # Every run, so a tag never finds the version's changelog section
        # missing.
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          packaging/release-notes.sh "$version"
      - uses: ./.github/actions/build-setup
      - name: Build, check and pack
        run: packaging/linux/package.sh ubuntu24.04
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-ubuntu24.04
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  arch:
    name: linux (arch linux)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        # The same libraries as on the development machine: the current
        # FFmpeg and PipeWire; bindgen needs clang; desktop-file-utils checks
        # the launcher.
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup clang pkgconf ffmpeg pipewire desktop-file-utils
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, check and pack
        run: |
          # The checkout belongs to the runner's user, not the container's.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/linux/package.sh archlinux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-archlinux
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  ffmpeg-windows:
    name: ffmpeg for windows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the FFmpeg build
        # Its sources are pinned, so the build changes only with the script
        # or the list of sources.
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ffmpeg-windows
          key: ffmpeg-windows-${{ hashFiles('packaging/windows/build-ffmpeg.sh', 'packaging/ffmpeg/sources.txt', 'packaging/ffmpeg/fetch-sources.sh') }}
      - name: Install the cross toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            mingw-w64 nasm cmake ninja-build make pkg-config
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: packaging/windows/build-ffmpeg.sh build/ffmpeg-windows
      - name: List the sources
        # In sha256sum's format, so the draft release checks them as it
        # does the packages.
        run: |
          cat build/ffmpeg-windows/BUILD-INFO.txt
          cd build/ffmpeg-windows/sources
          sha256sum -- *.tar.* > ffmpeg-sources.sha256
          cat ffmpeg-sources.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-windows
          path: |
            build/ffmpeg-windows
            !build/ffmpeg-windows/sources
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-ffmpeg-sources
          path: build/ffmpeg-windows/sources/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: windows
    needs: ffmpeg-windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        # Not the shared build setup: that installs the prebuilt FFmpeg CI
        # tests with, and this job links the one it ships.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-windows
          path: ${{ runner.temp }}/ffmpeg
      - name: Build, check and pack
        env:
          # bindgen (ffmpeg-sys-next) uses the runner's LLVM.
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: packaging/windows/package.ps1 -FFmpeg "${{ runner.temp }}/ffmpeg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ubuntu, arch, ffmpeg-windows, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Creating the draft release; nothing else is written.
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tag $GITHUB_REF_NAME, workspace version $version"
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Write the release notes
        run: packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum -c ./*.sha256)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "StreamForge ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
