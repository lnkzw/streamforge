[workspace]
resolver = "2"
members = [
    "crates/media-core",
    "crates/command-api",
    "crates/capture-api",
    "crates/capture-linux",
    "crates/capture-platform",
    "crates/engine",
    "crates/control-protocol",
    "crates/streamforge-engine",
    "crates/streamforge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lnkzw/streamforge"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
