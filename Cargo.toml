[workspace]
resolver = "2"
members = [
    "crates/media-core",
    "crates/command-api",
    "crates/capture-api",
    "crates/capture-linux",
    "crates/capture-cpal",
    "crates/capture-platform",
    "crates/video-compositor",
    "crates/audio-engine",
    "crates/encoder-api",
    "crates/encoder-ffmpeg",
    "crates/rtmp-test-server",
    "crates/engine",
    "crates/control-protocol",
    "crates/streamforge-engine",
    "crates/streamforge-cli",
    "crates/streamforge-desktop",
    "crates/streamforge-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lnkzw/streamforge"

[workspace.dependencies]
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Per-pixel code is 10-50x slower unoptimized; keep the rest of the
# workspace in normal debug mode.
[profile.dev.package.video-compositor]
opt-level = 3

[profile.dev.package.media-core]
opt-level = 3

[profile.dev.package.capture-linux]
opt-level = 3

[profile.dev.package.audio-engine]
opt-level = 3

[profile.dev.package.encoder-ffmpeg]
opt-level = 3
