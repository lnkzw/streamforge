[package]
name = "capture-cpal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
capture-api = { path = "../capture-api" }
media-core = { path = "../media-core" }

# Audio input through cpal: WASAPI on Windows, CoreAudio on macOS. Linux
# uses capture-linux (PipeWire); only the format converter builds there.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "=0.18.2"
