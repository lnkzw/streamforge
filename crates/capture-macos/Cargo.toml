[package]
name = "capture-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
capture-api = { path = "../capture-api" }
media-core = { path = "../media-core" }

# Screen capture through ScreenCaptureKit. The crate builds a small Swift
# bridge with the Xcode toolchain (Xcode 26 or newer: its Metal bindings
# need the macOS 26 SDK) and offers a safe API. `macos_14_0` provides the
# filter's pixel size (`SCShareableContentInfo`), so macOS 14 is required.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.0.0", features = ["macos_14_0"] }
# Cameras through AVFoundation (ADR 0019): the objc2 bindings, the same
# objc2 0.6 / 0.3 family that cpal and winit already pull in. Core Media
# and Core Video for the sample and pixel buffers, dispatch2 for the
# delegate's serial queue, block2 for the access request and the
# runtime error observer. The unsafe calls are isolated in `src/avf.rs`.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSNotification", "NSEnumerator", "NSOperation", "NSString", "NSValue", "NSObject", "block2"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureVideoDataOutput", "AVError", "AVMediaFormat", "block2", "dispatch2", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2", "block2"] }
block2 = "0.6.2"
