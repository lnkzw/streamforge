[package]
name = "capture-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
capture-api = { path = "../capture-api" }
media-core = { path = "../media-core" }

# Screen capture through ScreenCaptureKit (macOS 12.3+). The crate builds a
# small Swift bridge with the Xcode toolchain and offers a safe API.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=11.0.0"
