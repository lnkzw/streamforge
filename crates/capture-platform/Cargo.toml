[package]
name = "capture-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
capture-api = { path = "../capture-api" }

[target.'cfg(target_os = "linux")'.dependencies]
capture-linux = { path = "../capture-linux" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
capture-cpal = { path = "../capture-cpal" }

[target.'cfg(target_os = "windows")'.dependencies]
capture-windows = { path = "../capture-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
capture-macos = { path = "../capture-macos" }

# Runs on the main thread, as the programs call it, so it has its own
# main instead of the test harness.
[[test]]
name = "main_run_loop"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
