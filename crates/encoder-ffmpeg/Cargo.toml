[package]
name = "encoder-ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encoder-api = { path = "../encoder-api" }
media-core = { path = "../media-core" }

# FFmpeg is linked on Linux only for now; CI installs its development
# packages there. Other platforms get an `Unsupported` recorder (M9).
[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }

[dev-dependencies]
rtmp-test-server = { path = "../rtmp-test-server" }
