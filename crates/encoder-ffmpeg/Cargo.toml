[package]
name = "encoder-ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encoder-api = { path = "../encoder-api" }
media-core = { path = "../media-core" }

# The FFmpeg libraries on every platform (pkg-config on Linux and macOS,
# FFMPEG_DIR with a prebuilt shared build on Windows; docs/platforms.md).
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }

[dev-dependencies]
rtmp-test-server = { path = "../rtmp-test-server" }
