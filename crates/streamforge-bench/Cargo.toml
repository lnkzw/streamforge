[package]
name = "streamforge-bench"
description = "Measurement harness: records (and streams to an in-process ingest) for a fixed time and reports render, encoder and CPU figures"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
command-api = { path = "../command-api" }
engine = { path = "../engine" }
rtmp-test-server = { path = "../rtmp-test-server" }

# Process CPU time: getrusage on Unix, GetProcessTimes on Windows. Both
# crates are already in the build through other dependencies.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
