[package]
name = "streamforge-desktop"
description = "Desktop UI: scenes, preview, mixer and output controls over the command API"
version.workspace = true
edition.workspace = true
# The code is MIT OR Apache-2.0 like the workspace; the binary embeds the
# IBM Plex fonts (assets/fonts, SIL OFL 1.1).
license = "(MIT OR Apache-2.0) AND OFL-1.1"
rust-version = "1.95"

[[bin]]
name = "streamforge-desktop"
path = "src/main.rs"

[dependencies]
capture-platform = { path = "../capture-platform" }
command-api = { path = "../command-api" }
engine = { path = "../engine" }
media-core = { path = "../media-core" }
serde_json.workspace = true
# egui/eframe: pure-Rust immediate-mode UI on Linux, Windows and macOS
# (owner's choice for M7); the default features bring winit with Wayland and
# X11, the glow (OpenGL) renderer and AccessKit.
eframe = "0.36.2"
quit-signal = { path = "../quit-signal" }
# Local time for recording file names (already in the tree through rmcp).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
# Attaches the window program to the console it was started from
# (src/console.rs); already in the tree through other crates.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and version information into the .exe (build.rs,
# ADR 0020); without default features it reads nothing from Cargo.toml.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
# A capture backend for the tests that lists audio inputs (tests/support).
capture-api = { path = "../capture-api" }
# Drives the real UI headless: simulated input for component behaviour
# (tests/widgets.rs) and wgpu renders to check the visual result
# (tests/render.rs).
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
# Writes those renders as PNG (the version egui_kittest uses).
image = { version = "0.25", default-features = false, features = ["png"] }
