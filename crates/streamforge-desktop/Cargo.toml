[package]
name = "streamforge-desktop"
description = "Desktop UI: scenes, preview, mixer and output controls over the command API"
version.workspace = true
edition.workspace = true
# The code is MIT OR Apache-2.0 like the workspace; the binary embeds the
# IBM Plex fonts (assets/fonts, SIL OFL 1.1).
license = "(MIT OR Apache-2.0) AND OFL-1.1"
rust-version = "1.95"

[[bin]]
name = "streamforge-desktop"
path = "src/main.rs"

[dependencies]
capture-platform = { path = "../capture-platform" }
command-api = { path = "../command-api" }
engine = { path = "../engine" }
media-core = { path = "../media-core" }
serde_json.workspace = true
# egui/eframe: pure-Rust immediate-mode UI on Linux, Windows and macOS
# (owner's choice for M7); the default features bring winit with Wayland and
# X11, the glow (OpenGL) renderer and AccessKit.
eframe = "0.36.2"

[dev-dependencies]
# Drives the real UI headless: simulated input for component behaviour
# (tests/widgets.rs) and wgpu renders to check the visual result
# (tests/render.rs).
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
# Writes those renders as PNG (the version egui_kittest uses).
image = { version = "0.25", default-features = false, features = ["png"] }
