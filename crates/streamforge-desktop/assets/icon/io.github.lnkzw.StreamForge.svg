<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- StreamForge app icon: the program monitor with a picture-in-picture
       layer (accent) and the on-air tally (tally.program), in the colours of
       docs/ui/design-system.md. The window icon is rendered from it:
       rsvg-convert -w 256 -h 256 io.github.lnkzw.StreamForge.svg -o window-256.png
       and the icon of streamforge-desktop.exe (build.rs) from its sizes:
       for s in 16 20 24 32 40 48 64 256; do rsvg-convert -w $s -h $s io.github.lnkzw.StreamForge.svg -o $s.png; done
       magick 16.png 20.png 24.png 32.png 40.png 48.png 64.png 256.png windows.ico
       and the macOS app's icon (packaging/macos/package.sh) at the size of
       Apple's icon grid (824 of 1024 pixels), with Pillow:
       rsvg-convert -w 824 -h 824 io.github.lnkzw.StreamForge.svg -o 824.png
       magick 824.png -background none -gravity center -extent 1024x1024 1024.png
       python3 -c 'from PIL import Image; Image.open("1024.png").save("macos.icns")' -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="#16171A" stroke="#33363B" stroke-width="4"/>
  <rect x="36" y="60" width="184" height="116" rx="14" fill="#0B0C0D" stroke="#E7E8EA" stroke-width="10"/>
  <rect x="112" y="108" width="86" height="50" rx="6" fill="#2CB5C2"/>
  <circle cx="66" cy="90" r="12" fill="#E2393B"/>
  <rect x="98" y="194" width="60" height="10" rx="5" fill="#E7E8EA"/>
</svg>
