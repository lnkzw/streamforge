[package]
name = "streamforge-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "streamforge-engine"
path = "src/main.rs"

[dependencies]
clap.workspace = true
capture-platform = { path = "../capture-platform" }
control-protocol = { path = "../control-protocol" }
engine = { path = "../engine" }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
rtmp-test-server = { path = "../rtmp-test-server" }
