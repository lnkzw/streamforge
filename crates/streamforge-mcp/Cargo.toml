[package]
name = "streamforge-mcp"
description = "MCP server: agents use the command API with an access policy chosen by the user"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "streamforge-mcp"
path = "src/main.rs"

[dependencies]
capture-platform = { path = "../capture-platform" }
command-api = { path = "../command-api" }
encoder-api = { path = "../encoder-api" }
engine = { path = "../engine" }
quit-signal = { path = "../quit-signal" }
clap.workspace = true
serde_json.workspace = true
# The official Rust MCP SDK (protocol negotiation, JSON-RPC framing, stdio
# transport); pinned because 3.x minor releases still change APIs.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
# rmcp is async; the engine stays on its own thread and calls reach it
# through `spawn_blocking`.
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt", "macros", "process", "sync"] }

rtmp-test-server = { path = "../rtmp-test-server" }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
